<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="dashboard">

    <!-- Top card: digital clock, full date, greeting -->
    <section class="card card--greeting" aria-label="Today">
      <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle light/dark theme">
        <svg class="icon icon--moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon icon--sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <div class="clock" id="clock">00:00:00</div>
      <div class="date" id="date">—</div>
      <div class="greeting-row">
        <p class="greeting"><span id="greeting-text">Welcome</span><span id="greeting-comma" class="greeting-comma" hidden>, </span><span id="name-slot" class="name-slot"></span></p>
        <button type="button" id="name-edit-btn" class="icon-btn" aria-label="Edit your name" title="Edit your name">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
      </div>
    </section>

    <!-- Middle left card: Focus Timer -->
    <section class="card card--timer" aria-label="Focus Timer">
      <h2 class="card__title">Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button type="button" id="timer-start" class="btn btn--primary">Start</button>
        <button type="button" id="timer-stop" class="btn">Stop</button>
        <button type="button" id="timer-reset" class="btn">Reset</button>
      </div>
    </section>

    <!-- Middle right card: Tasks -->
    <section class="card card--tasks" aria-label="Tasks">
      <h2 class="card__title">Tasks</h2>
      <form class="task-form" id="task-form">
        <input
          type="text"
          id="task-input"
          class="input"
          placeholder="Add a new task…"
          aria-label="New task"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn--primary">Add</button>
      </form>
      <p id="task-msg" class="form-msg" role="status" aria-live="polite" hidden></p>
      <ul class="task-list" id="task-list"></ul>
    </section>

    <!-- Bottom left card: Quick Links -->
    <section class="card card--links" aria-label="Quick Links">
      <h2 class="card__title">Quick Links</h2>
      <form class="links-form" id="links-form">
        <input
          type="text"
          id="link-name"
          class="input"
          placeholder="Link name"
          aria-label="Link name"
          autocomplete="off"
          required
        />
        <input
          type="text"
          id="link-url"
          class="input"
          placeholder="https://example.com"
          aria-label="Link URL"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn--primary">Add Link</button>
      </form>
      <div class="links-list" id="links-list"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
